name: Release

# A codex you can cite needs versions. This turns conventional commits on main
# into a release pull request, and merging that pull request cuts a tagged
# release with a changelog — so "Hammurabi v1.2, § 07" means one exact text.
#
# Requires "Allow GitHub Actions to create and approve pull requests" under
# Settings -> Actions -> General.

on:
  push:
    branches: ["main"]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # Credentials stay in the workspace here, unlike the reviewer workflow:
      # release-please tags and releases through this checkout's token, and
      # stripping it is what "Resource not accessible by integration" was.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      # `release-as` in the config is a one-shot: it pins the next release to a
      # chosen version, and then pins every release after it to the same version
      # until somebody remembers to take it out. Nobody remembers, so this says
      # so out loud.
      #
      # The test is whether the tag exists, not whether the manifest matches.
      # release-please bumps the manifest inside the release pull request, so by
      # the time this runs on main the two are always equal — comparing them
      # blocked the very run that creates the tag. The tag does not exist until
      # that run succeeds, so testing for it fires on the next push instead,
      # which is when the pin has genuinely outlived its purpose.
      - name: Fail if the version pin has already shipped
        run: |
          pin=$(jq -r '.packages["."]["release-as"] // empty' .github/release-please-config.json)
          if [ -n "$pin" ] && git rev-parse -q --verify "refs/tags/v$pin" >/dev/null; then
            echo "::error file=.github/release-please-config.json::release-as \"$pin\" shipped as tag v$pin. Remove it so the next version is computed from the commits again."
            exit 1
          fi

      # Known unresolved: on the 1.0.0 release this step opened the pull request
      # fine and then failed with "Resource not accessible by integration" on
      # create-a-release, and v1.0.0 had to be tagged by hand. Ruled out at the
      # time: the job was granted Contents: write, the token input defaults to
      # github.token, the repository has no rulesets, no tag protection and no
      # branch protection, and raising the repository's default workflow
      # permission changed nothing. The step below narrows it on the next
      # failure instead of making anyone reconstruct all that again.
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json

      # Asks the one question the error does not answer: can this token create a
      # release at all, or is it release-please's call in particular? A dry-run
      # POST is not possible, so this reads the collection, which needs the same
      # contents scope, and reports what the API says.
      - name: Report what the token can reach
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "::group::token reachability"
          echo "releases (read):"
          gh api "repos/${{ github.repository }}/releases?per_page=1" \
            --jq 'length' || echo "  unreadable"
          echo "permissions the run was granted are printed in Set up job above."
          echo "If reads work and creates do not, the token is scoped but the"
          echo "create is being refused — cut the release by hand and open an"
          echo "issue upstream; otherwise the grant is the problem."
          echo "::endgroup::"
