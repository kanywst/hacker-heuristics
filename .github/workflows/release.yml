name: Release

# A codex you can cite needs versions. This turns conventional commits on main
# into a release pull request, and merging that pull request cuts a tagged
# release with a changelog — so "Hammurabi v1.2, § 07" means one exact text.
#
# Requires "Allow GitHub Actions to create and approve pull requests" under
# Settings -> Actions -> General.

on:
  push:
    branches: ["main"]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # Credentials stay in the workspace here, unlike the reviewer workflow:
      # release-please tags and releases through this checkout's token, and
      # stripping it is what "Resource not accessible by integration" was.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      # `release-as` in the config is a one-shot: it pins the next release to a
      # chosen version, and then pins every release after it to the same version
      # until somebody remembers to take it out. Nobody remembers, so this says
      # so out loud.
      #
      # The test is whether the tag exists, not whether the manifest matches.
      # release-please bumps the manifest inside the release pull request, so by
      # the time this runs on main the two are always equal — comparing them
      # blocked the very run that creates the tag. The tag does not exist until
      # that run succeeds, so testing for it fires on the next push instead,
      # which is when the pin has genuinely outlived its purpose.
      - name: Fail if the version pin has already shipped
        run: |
          pin=$(jq -r '.packages["."]["release-as"] // empty' .github/release-please-config.json)
          if [ -n "$pin" ] && git rev-parse -q --verify "refs/tags/v$pin" >/dev/null; then
            echo "::error file=.github/release-please-config.json::release-as \"$pin\" shipped as tag v$pin. Remove it so the next version is computed from the commits again."
            exit 1
          fi

      - uses: googleapis/release-please-action@v5
        with:
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json
