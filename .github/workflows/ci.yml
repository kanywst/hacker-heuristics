name: CI (Code Quality & Security)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  # The codex used to live in three hand-maintained copies, and they drifted.
  # This job is what makes that impossible: data/laws.yaml has to be structurally
  # valid, and every file generated from it has to match what the generator
  # produces right now.
  codex:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate the codex
        run: npm run validate

      - name: Check generated files are up to date
        run: npm run generate:check

  quality-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./website

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint

      - name: Check Formatting
        run: npm run format:check

      - name: Type Check
        run: npm run type-check

      - name: Security Audit
        run: npm run audit:check

      - name: Build Test
        run: npm run build

      # The figures in the markdown are extracted from the built site, so a
      # change to a diagram component has to bring its committed copy with it.
      - name: Check the markdown figures match the site
        working-directory: .
        run: |
          npm ci
          npm run generate:diagrams:check
