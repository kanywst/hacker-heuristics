name: Claude review

# CI answers "does it build and do the tests pass". This asks the question no
# script here can. It reviews, it does not gate: nothing here is a required
# check.
#
# The action validates this file against the copy on the default branch and
# skips itself if they differ, so a pull request cannot rewrite its own reviewer.
# The cost is that any pull request touching this file goes unreviewed until the
# change is on main — land the workflow edit first, then reopen or re-push the
# work that needed it.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions: {}

# One review per pull request. A rapid re-push cancels the run it superseded
# rather than paying for a review of a diff that no longer exists.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Every pull request gets reviewed, drafts included, with three exceptions.
    # Two are mechanical, one is editorial:
    #
    # Dependabot runs are handed dependabot secrets rather than the repository's,
    # so the token is not there to be read and every dependency bump would go red
    # on the check step instead of being reviewed.
    #
    # A pull request from a fork gets no secrets at all, for the same reason.
    # Skipping is the graceful outcome; the alternative is a guaranteed failure
    # that says nothing about the diff.
    #
    # release-please's branch carries a generated changelog and a version bump.
    # There is no prose in it to check against a prompt about attribution and
    # counter-forces, so reviewing it would post "nothing to flag" on every
    # release forever. This skips the branch rather than the actor, so a human
    # pull request is still reviewed no matter who opened it.
    if: >-
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      !startsWith(github.event.pull_request.head.ref, 'release-please--') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      # Required by the action's default GitHub App authentication.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          # Nothing here pushes, and the action authenticates through the GitHub
          # App rather than this token. Leaving the token in the workspace git
          # config only widens what the third-party action can reach.
          persist-credentials: false

      # Without the secret the action exits successfully having reviewed
      # nothing, which is worse than failing: the check goes green and the
      # pull request looks reviewed. Fail here instead, where the reason is
      # legible.
      - name: Require the token
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN is not set. Generate one with 'claude setup-token', then: gh secret set CLAUDE_CODE_OAUTH_TOKEN"
            exit 1
          fi

      - uses: anthropics/claude-code-action@9d7150bc8a3dae8149739a88019d192b579ad90c # v1
        with:
          # A subscription token, not an API key: runs against the Claude plan
          # instead of API credits. Generate it with `claude setup-token`.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The action keeps its own list of who may trigger it and errors out on
          # a bot rather than skipping, which turns "not reviewed" into a red
          # check. Who gets reviewed is decided once, in the `if` above; this
          # stops the action being a second, hidden policy that fails instead.
          allowed_bots: '*'
          prompt: |
            REPO: ${{ github.repository }}
            PR: ${{ github.event.pull_request.number }}

            hammurabi is a codex of engineering laws, each with its counter-force, a field
            guideline and a primary source. `data/laws.yaml` is the only source of truth;
            README.md, translations/ja.md and website/src/data/laws.ts are generated from
            it by scripts/generate.mjs. The site is under website/.

            Do not repeat what CI already does. Lint, types, the build, the codex schema
            and the generated-file drift check all run on this PR already. Reviewing the
            generated files is wasted effort — read the diff in data/laws.yaml.

            Look for what only a reader can catch:

            1. Entries that break their own form. Each law needs a genuine counter-force
               rather than a restatement or a caveat, a guideline that is actually
               actionable, and a source that says what it is cited for.

            2. Attribution. A law credited to the wrong person, a source that is a blog
               post quoting the real source, or a date that belongs to a different work,
               is the defect readers will catch first. Check the citation against what the
               entry claims it supports.

            3. Translation parity. A change to `en` that `ja` misses — or a `ja` rendering
               that softens, strengthens or drops a claim — leaves the two codices
               asserting different things.

            4. Over-claiming. These are heuristics, not laws of nature, and a sentence that
               forgets that is worth flagging.

            5. Slug stability. A changed `slug` on an existing law silently breaks every
               permalink to it. Flag any diff that renames one.

            Post findings as inline comments on the lines they concern. Use one
            top-level comment for the summary, posted with
            `gh pr comment --edit-last --create-if-none` so that a re-review
            replaces the previous summary rather than stacking another one
            underneath it. Be specific and cite
            `file:line`. If the diff is clean against all of the above, say so
            in one line rather than manufacturing nits.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
