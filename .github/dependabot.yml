version: 2
updates:
  # The codex tooling at the repository root (yaml parser only).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 3
    labels:
      - dependencies

  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    ignore:
      # eslint-plugin-react (transitive of eslint-config-next 16) is not
      # yet ESLint 10 compatible — it throws
      # `contextOrFilename.getFilename is not a function`. Hold ESLint
      # at 9.x until the upstream plugin ships a fix.
      - dependency-name: eslint
        update-types:
          - version-update:semver-major
      # brace-expansion is only patched in 5.0.8, but it is reached through
      # minimatch 3.x (via eslint / eslint-config-next), which requires the
      # 1.x line. Forcing 5.x breaks ESLint at runtime with
      # `TypeError: expand is not a function`, because v5 changed its export
      # shape. The 1.x and 2.x lines have no patched release, so there is no
      # compatible fix — dev-only, build-time, and the globs it expands are
      # authored in this repo. `audit:check` gates production deps instead.
      - dependency-name: brace-expansion
      # typescript-eslint (transitive of eslint-config-next 16) pins its peer
      # range to `typescript >=4.8.4 <6.1.0`, and typescript-estree crashes on
      # the TypeScript 7 compiler API with
      # `TypeError: Cannot read properties of undefined (reading 'Cjs')`.
      # Hold TypeScript at 6.x until typescript-eslint supports TS 7.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
    groups:
      next-react:
        patterns:
          - "next"
          - "eslint-config-next"
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
          - "autoprefixer"
          - "postcss"
      dev-minor:
        dependency-type: development
        update-types:
          - minor
          - patch
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    labels:
      - dependencies
      - ci
