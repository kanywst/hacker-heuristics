<svg xmlns="http://www.w3.org/2000/svg" width="600" height="230" viewBox="0 0 600 230" role="img"><title>One request fanning out to 100 leaves; the odds that at least one is slow</title><rect width="600" height="230" fill="#100e0c"/><g><line x1="106" y1="110" x2="250" y2="31" stroke="#8b8478" stroke-opacity="0.35" stroke-width="1"></line><rect x="250" y="26" width="34" height="10" rx="2" fill="#8b8478" fill-opacity="0.35"></rect></g><g><line x1="106" y1="110" x2="250" y2="46" stroke="#8b8478" stroke-opacity="0.35" stroke-width="1"></line><rect x="250" y="41" width="34" height="10" rx="2" fill="#8b8478" fill-opacity="0.35"></rect></g><g><line x1="106" y1="110" x2="250" y2="61" stroke="#8b8478" stroke-opacity="0.35" stroke-width="1"></line><rect x="250" y="56" width="34" height="10" rx="2" fill="#8b8478" fill-opacity="0.35"></rect></g><g><line x1="106" y1="110" x2="250" y2="76" stroke="#8b8478" stroke-opacity="0.35" stroke-width="1"></line><rect x="250" y="71" width="34" height="10" rx="2" fill="#8b8478" fill-opacity="0.35"></rect></g><g><line x1="106" y1="110" x2="250" y2="91" stroke="#8b8478" stroke-opacity="0.35" stroke-width="1"></line><rect x="250" y="86" width="34" height="10" rx="2" fill="#8b8478" fill-opacity="0.35"></rect></g><g><line x1="106" y1="110" x2="250" y2="106" stroke="#8b8478" stroke-opacity="0.35" stroke-width="1"></line><rect x="250" y="101" width="34" height="10" rx="2" fill="#8b8478" fill-opacity="0.35"></rect></g><g><line x1="106" y1="110" x2="250" y2="121" stroke="#8b8478" stroke-opacity="0.35" stroke-width="1"></line><rect x="250" y="116" width="34" height="10" rx="2" fill="#8b8478" fill-opacity="0.35"></rect></g><g><line x1="106" y1="110" x2="250" y2="136" stroke="#e0684c" stroke-opacity="1" stroke-width="1.6"></line><rect x="250" y="131" width="54" height="10" rx="2" fill="#c9543a" fill-opacity="0.9"></rect></g><g><line x1="106" y1="110" x2="250" y2="151" stroke="#8b8478" stroke-opacity="0.35" stroke-width="1"></line><rect x="250" y="146" width="34" height="10" rx="2" fill="#8b8478" fill-opacity="0.35"></rect></g><g><line x1="106" y1="110" x2="250" y2="166" stroke="#8b8478" stroke-opacity="0.35" stroke-width="1"></line><rect x="250" y="161" width="34" height="10" rx="2" fill="#8b8478" fill-opacity="0.35"></rect></g><g><line x1="106" y1="110" x2="250" y2="181" stroke="#8b8478" stroke-opacity="0.35" stroke-width="1"></line><rect x="250" y="176" width="34" height="10" rx="2" fill="#8b8478" fill-opacity="0.35"></rect></g><g><line x1="106" y1="110" x2="250" y2="196" stroke="#8b8478" stroke-opacity="0.35" stroke-width="1"></line><rect x="250" y="191" width="34" height="10" rx="2" fill="#8b8478" fill-opacity="0.35"></rect></g><rect x="48" y="96" width="58" height="28" rx="4" fill="#171410" stroke="#8b8478" stroke-opacity="0.6"></rect><text x="77" y="114" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#ece6d9">Request</text><text x="250" y="18" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#8b8478">Leaves</text><text x="310" y="140" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#e0684c">slow leaf</text><text x="250" y="222" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#8b8478">each leaf independently slow 1% of the time</text><g><text x="400" y="54" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#8b8478">Fan-out</text><text x="580" y="54" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#8b8478">P(at least one slow leaf)</text><line x1="400" y1="62" x2="580" y2="62" stroke="#8b8478" stroke-opacity="0.4"></line></g><g><text x="400" y="80" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#ece6d9">1 leaf</text><text x="580" y="80" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#ece6d9">1%</text></g><g><text x="400" y="106" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#ece6d9">10 leaves</text><text x="580" y="106" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#ece6d9">10%</text></g><g><text x="400" y="132" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#e0684c">100 leaves</text><text x="580" y="132" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#e0684c">63%</text></g></svg>
