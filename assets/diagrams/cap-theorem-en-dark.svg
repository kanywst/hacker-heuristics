<svg xmlns="http://www.w3.org/2000/svg" width="600" height="230" viewBox="0 0 600 230" role="img"><title>The CAP triangle, with partition tolerance marked as not optional and the live choice on the remaining edge</title><rect width="600" height="230" fill="#100e0c"/><line x1="300" y1="48" x2="150" y2="158" stroke="#8b8478" stroke-opacity="0.35" stroke-width="1.5"></line><line x1="300" y1="48" x2="450" y2="158" stroke="#8b8478" stroke-opacity="0.35" stroke-width="1.5"></line><line x1="150" y1="158" x2="450" y2="158" stroke="#e0684c" stroke-width="2.5"></line><circle cx="300" cy="158" r="4" fill="#e0684c"></circle><text x="300" y="178" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#e0684c">the only real decision</text><circle cx="300" cy="48" r="5" fill="#100e0c" stroke="#8b8478" stroke-opacity="0.7"></circle><text x="300" y="18" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#8b8478">Partition tolerance</text><text x="300" y="34" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#8b8478">not a choice — the network partitions</text><circle cx="150" cy="158" r="5" fill="#e0684c"></circle><text x="150" y="144" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#ece6d9">Consistency</text><text x="144" y="196" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#8b8478">CP · refuse writes, stay correct</text><circle cx="450" cy="158" r="5" fill="#e0684c"></circle><text x="450" y="144" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#ece6d9">Availability</text><text x="456" y="196" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#8b8478">AP · accept writes, reconcile later</text></svg>
