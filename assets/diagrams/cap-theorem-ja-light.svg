<svg xmlns="http://www.w3.org/2000/svg" width="600" height="230" viewBox="0 0 600 230" role="img"><title>CAP の三角形。分断耐性は選択肢ではなく、実際の選択は残る一辺の上にある</title><rect width="600" height="230" fill="#ffffff"/><line x1="300" y1="48" x2="150" y2="158" stroke="#59636e" stroke-opacity="0.35" stroke-width="1.5"></line><line x1="300" y1="48" x2="450" y2="158" stroke="#59636e" stroke-opacity="0.35" stroke-width="1.5"></line><line x1="150" y1="158" x2="450" y2="158" stroke="#cf3a1c" stroke-width="2.5"></line><circle cx="300" cy="158" r="4" fill="#cf3a1c"></circle><text x="300" y="178" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#cf3a1c">唯一の実際の判断</text><circle cx="300" cy="48" r="5" fill="#ffffff" stroke="#59636e" stroke-opacity="0.7"></circle><text x="300" y="18" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#59636e">分断耐性</text><text x="300" y="34" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#59636e">選択肢ではない——ネットワークは分断する</text><circle cx="150" cy="158" r="5" fill="#cf3a1c"></circle><text x="150" y="144" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#1f2328">一貫性</text><text x="144" y="196" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#59636e">CP · 書き込みを拒み、正しさを保つ</text><circle cx="450" cy="158" r="5" fill="#cf3a1c"></circle><text x="450" y="144" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#1f2328">可用性</text><text x="456" y="196" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#59636e">AP · 書き込みを受け、後で収束させる</text></svg>
