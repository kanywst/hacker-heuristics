<svg xmlns="http://www.w3.org/2000/svg" width="600" height="230" viewBox="0 0 600 230" role="img"><title>A queue with arrival rate lambda, L items in the system, and time W spent in it</title><rect width="600" height="230" fill="#ffffff"/><defs><marker id="ll-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#59636e"></path></marker></defs><line x1="40" y1="99" x2="164" y2="99" stroke="#59636e" stroke-width="1.5" marker-end="url(#ll-arrow)"></line><text x="40" y="87" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#1f2328">Arrivals λ</text><rect x="170" y="62" width="260" height="74" rx="6" fill="#f6f8fa" stroke="#59636e" stroke-opacity="0.5"></rect><rect x="188" y="88" width="24" height="24" rx="3" fill="#a3260f" fill-opacity="0.85"></rect><rect x="222" y="88" width="24" height="24" rx="3" fill="#a3260f" fill-opacity="0.85"></rect><rect x="256" y="88" width="24" height="24" rx="3" fill="#a3260f" fill-opacity="0.85"></rect><rect x="290" y="88" width="24" height="24" rx="3" fill="#a3260f" fill-opacity="0.85"></rect><rect x="324" y="88" width="24" height="24" rx="3" fill="#a3260f" fill-opacity="0.85"></rect><rect x="358" y="88" width="24" height="24" rx="3" fill="#a3260f" fill-opacity="0.25"></rect><rect x="392" y="88" width="24" height="24" rx="3" fill="#a3260f" fill-opacity="0.25"></rect><text x="300" y="50" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#1f2328">L items in the system</text><line x1="436" y1="99" x2="560" y2="99" stroke="#59636e" stroke-width="1.5" marker-end="url(#ll-arrow)"></line><text x="560" y="87" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#1f2328">Departures</text><line x1="170" y1="152" x2="430" y2="152" stroke="#59636e" stroke-width="1.5"></line><line x1="170" y1="147" x2="170" y2="157" stroke="#59636e" stroke-width="1.5"></line><line x1="430" y1="147" x2="430" y2="157" stroke="#59636e" stroke-width="1.5"></line><text x="300" y="172" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#59636e">W — time each item spends inside</text><text x="300" y="26" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#cf3a1c">L = λW</text><text x="300" y="196" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#cf3a1c">cap L → W falls, with λ unchanged</text></svg>
