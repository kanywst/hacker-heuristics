<svg xmlns="http://www.w3.org/2000/svg" width="600" height="232" viewBox="0 0 600 232" role="img"><title>ペローの2軸——相互作用の複雑さと結合度。事故が構造的になる象限を示す</title><rect width="600" height="232" fill="#ffffff"/><defs><marker id="na-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#59636e"></path></marker></defs><rect x="326" y="44" width="194" height="71" fill="#a3260f" fill-opacity="0.13"></rect><rect x="132" y="44" width="388" height="142" fill="none" stroke="#59636e" stroke-opacity="0.5"></rect><line x1="326" y1="44" x2="326" y2="186" stroke="#59636e" stroke-opacity="0.4"></line><line x1="132" y1="115" x2="520" y2="115" stroke="#59636e" stroke-opacity="0.4"></line><text x="423" y="61" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#cf3a1c">通常事故はここに棲む</text><text x="229" y="150.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#59636e"><tspan x="229" dy="0">組立ライン</tspan><tspan x="229" dy="14">バッチ処理</tspan></text><text x="229" y="79.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#59636e"><tspan x="229" dy="0">ダム</tspan><tspan x="229" dy="14">鉄道網</tspan></text><text x="423" y="150.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#59636e"><tspan x="423" dy="0">大学</tspan><tspan x="423" dy="14">研究開発</tspan></text><text x="423" y="75.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#1f2328"><tspan x="423" dy="0">原子力発電所</tspan><tspan x="423" dy="14">マイクロサービス網</tspan></text><line x1="494" y1="89" x2="494" y2="141" stroke="#59636e" stroke-width="1.5" marker-end="url(#na-arrow)"></line><text x="500" y="139" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#59636e">疎結合化</text><line x1="356" y1="109" x2="296" y2="109" stroke="#59636e" stroke-width="1.5" marker-end="url(#na-arrow)"></line><text x="326" y="129" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#59636e">相互作用を削る</text><text x="118" y="58" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#1f2328">密結合</text><text x="118" y="184" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#1f2328">疎結合</text><text x="132" y="212" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#1f2328">線形な相互作用</text><text x="520" y="212" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#1f2328">複雑な相互作用</text></svg>
